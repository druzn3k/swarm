# Release builds of the Rust frontends: the Tauri desktop app (AppImage and
# .deb, rust/crates/tauri wrapping app/dist with the engine as wasm) and the
# `swarm` / `swarm-tui` terminal binaries. Runs on version tags (v*) and by
# hand. On a tag, the files are also attached to that tag's GitHub release
# (created if missing). Linux x86_64 only.

name: desktop

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # must match the wasm-bindgen crate in rust/Cargo.lock
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach files to the release on tags
    steps:
    - uses: actions/checkout@v7

    - name: System packages (WebKitGTK and friends)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libssl-dev build-essential file patchelf pkg-config

    - name: Rust stable with the wasm32 target
      run: |
        rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
        rustup default stable

    - name: Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          rust/target
        key: desktop-cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: desktop-cargo-${{ runner.os }}-

    - name: Cached CLI tools (wasm-bindgen, tauri)
      id: tools
      uses: actions/cache@v4
      with:
        path: ~/.cargo-tools
        key: cargo-tools-${{ runner.os }}-wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-tauri-2

    - name: Install wasm-bindgen-cli and tauri-cli
      if: steps.tools.outputs.cache-hit != 'true'
      run: |
        cargo install --locked --root ~/.cargo-tools wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
        cargo install --locked --root ~/.cargo-tools tauri-cli --version '^2'

    - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

    - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
    - uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile

    # beforeBuildCommand (tauri.conf.json) builds the app and its workspace
    # dependencies with SWARM_WASM_REQUIRED=1, then bundles app/dist
    - name: Desktop app (AppImage, deb)
      working-directory: rust/crates/tauri
      run: cargo tauri build --ci

    - name: Terminal binaries (swarm, swarm-tui)
      working-directory: rust
      run: |
        cargo build --release -p swarm-cli -p swarm-tui
        mkdir -p ../dist-bin
        for b in swarm swarm-tui; do
          strip -o "../dist-bin/$b-linux-x86_64" "target/release/$b"
        done

    - name: Collect files
      run: |
        mkdir -p out
        cp rust/target/release/bundle/appimage/*.AppImage out/
        cp rust/target/release/bundle/deb/*.deb out/
        cp dist-bin/* out/
        ls -l out

    - uses: actions/upload-artifact@v4
      with:
        name: swarm-linux-x86_64
        path: out/*
        if-no-files-found: error

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release view "$TAG" >/dev/null 2>&1 \
          || gh release create "$TAG" --title "$TAG" --generate-notes
        gh release upload "$TAG" out/* --clobber
