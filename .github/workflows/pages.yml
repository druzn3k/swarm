# Publishes the pixel mock-up (mockup/) to GitHub Pages on every push to master.
name: deploy mock-up to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @swarmsim/mockup test
    - run: pnpm --filter @swarmsim/mockup build
    # needs Settings > Pages > Source set to "GitHub Actions" once; the
    # workflow's own token isn't allowed to switch Pages on
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: mockup/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
