# Publishes the pixel mock-up (mockup/) to GitHub Pages on every push to master,
# by pushing the built files to the `gh-pages` branch. In Settings > Pages,
# set Source to "Deploy from a branch", branch `gh-pages`, folder `/ (root)`.
name: deploy mock-up to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

# one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @swarmsim/mockup test
    - run: pnpm --filter @swarmsim/mockup build
    # gh-pages holds only the latest build, so it's replaced on every deploy
    - name: push to gh-pages
      working-directory: mockup/dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        touch .nojekyll
        git init -q -b gh-pages
        git add -A
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -q -m "Deploy mock-up from ${GITHUB_SHA}"
        git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
