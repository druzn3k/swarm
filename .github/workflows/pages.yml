# Publishes the app (app/) to GitHub Pages on every push to master.
# Needs Settings > Pages > Source set to "GitHub Actions" (done once by hand;
# the workflow's own token isn't allowed to switch Pages on).
name: deploy app to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @swarmsim/app test
    - run: pnpm --filter @swarmsim/app build
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
