# Tests everything, then deploys the app (app/) to GitHub Pages from master:
# the `pages` job runs only after `packages` passed, so a commit that fails
# the app's tests or e2e never ships. Run it by hand (workflow_dispatch) on
# master to redeploy. The `legacy` job (the old AngularJS game, not the app)
# doesn't hold the deploy back. Netlify deploys the old game from the
# `master` and `production` branches on its own.
# Pages needs Settings > Pages > Source set to "GitHub Actions" (done once by
# hand; the workflow's own token isn't allowed to switch Pages on).

name: continuous integration

on:
  push:
    branches: [ "master", "production" ]
  pull_request:
    branches: [ "master", "production" ]
  workflow_dispatch:

jobs:
  # tables, swarmsim-ts, engine and app: a pnpm workspace on current Node
  packages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
    - uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm test:packages
    # app smoke test in a phone-sized Chromium, against the production build from test:packages
    - run: pnpm --filter @swarmsim/app exec playwright install --with-deps chromium
    - run: pnpm --filter @swarmsim/app e2e
    # random-spawn seeds once depended on the player's timezone; keep the engine timezone-proof
    - run: pnpm --filter @swarmsim/engine exec jest
      env:
        TZ: Asia/Tokyo
    # the build that was just tested is the one that gets deployed
    - if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: actions/upload-pages-artifact@v5
      with:
        path: app/dist

  # publish the app to GitHub Pages, only from master and only once the packages passed
  pages:
    needs: [packages]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # one deploy at a time
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v6
    - id: deployment
      uses: actions/deploy-pages@v5

  # the old AngularJS game: Yarn 1, Node 16, Ruby compass. Left as-is until it's retired.
  legacy:
    runs-on: ubuntu-latest
    env:
      # the root package.json names pnpm; let Yarn 1 run anyway
      SKIP_YARN_COREPACK_CHECK: "1"
    steps:
    - uses: actions/checkout@v7
    # build the packages it consumes with current Node and pnpm...
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @swarmsim/tables build && pnpm --filter @swarmsim/ts build
    # ...then switch to the old toolchain (no pnpm calls after this point)
    - uses: actions/setup-node@v7
      with:
        node-version: "16.x"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: gem install compass
    - run: sh scripts/legacy-install.sh
    - run: cd swarmsim-coffee && yarn test
      env:
        # PhantomJS can't start against the runner's OpenSSL 3 config; the
        # Dockerfile and devcontainer use the same fix. Scoped to this step.
        OPENSSL_CONF: /dev/null
