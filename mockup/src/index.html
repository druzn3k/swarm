<title>Swarm Hive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  /* Layout: a window into the hive on top, specimen cards below, tabs in thumb reach. Single dark world by choice. */
  :root {
    --earth: #170d16;      /* page ground */
    --burrow: #24151f;     /* card fill */
    --burrow-hi: #33202d;  /* raised / hover */
    --chitin: #7d3f97;     /* brand purple */
    --amber: #f2b33d;      /* action, resin */
    --bone: #efe3d2;       /* text */
    --dust: #a8929c;       /* muted text */
    --flesh: #d2505b;      /* meat */
    --edge: #0b060b;       /* pixel outlines */
    --display: "Silkscreen", "Courier New", monospace;
    --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
    --px: 3px;             /* one art pixel at UI scale */
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--earth); color: var(--bone); }
  :root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  body {
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.35;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--earth);
  }
  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  img.px-icon, img.nav-icon { image-rendering: pixelated; image-rendering: crisp-edges; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* pixel frame: hard stepped corners instead of rounded ones */
  .frame {
    background: var(--burrow);
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--edge), 0 var(--px) 0 0 var(--edge),
      calc(-1 * var(--px)) 0 0 0 var(--edge), var(--px) 0 0 0 var(--edge);
  }

  /* header: resources */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--earth); padding-block: 10px 6px;
    display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: center;
  }
  .brand { font-family: var(--display); font-size: 20px; letter-spacing: 1px; color: var(--amber); line-height: 1; }
  .brand small { display: block; font-size: 10px; color: var(--dust); letter-spacing: 2px; margin-top: 2px; }
  .res { display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center; padding: 6px 8px; min-width: 0; }
  .res img { grid-row: span 2; width: 26px; height: 26px; }
  .res b { font-family: var(--display); font-weight: 400; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res span { font-size: 12px; color: var(--dust); white-space: nowrap; }

  /* the hive window */
  .scene { position: relative; padding: 0; }
  .scene canvas { display: block; width: 100%; height: auto; aspect-ratio: 160 / 84; image-rendering: pixelated; image-rendering: crisp-edges; }
  .scene-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; color: var(--dust); }
  .chip {
    font-family: var(--display); font-size: 11px; letter-spacing: 1px;
    background: var(--burrow-hi); border: 0; padding: 6px 10px; min-height: 32px; cursor: pointer;
    box-shadow: 0 2px 0 var(--edge);
  }
  .chip[aria-pressed="true"] { background: var(--amber); color: var(--edge); }

  h2 { font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; margin: 6px 0 0; color: var(--dust); }

  /* specimen cards */
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .card { background: var(--burrow); box-shadow: 0 -3px 0 var(--edge), 0 3px 0 var(--edge), -3px 0 0 var(--edge), 3px 0 0 var(--edge); }
  .card-head {
    width: 100%; display: grid; grid-template-columns: 48px 1fr auto 14px; gap: 12px; align-items: center;
    background: none; border: 0; padding: 10px 12px; text-align: left; cursor: pointer; min-height: 64px;
  }
  .card-head img { width: 48px; height: 48px; background: var(--earth); }
  .card-names { display: grid; min-width: 0; }
  .card-name { font-family: var(--display); font-size: 15px; text-transform: capitalize; overflow-wrap: anywhere; }
  .card-rate { font-size: 13px; color: var(--amber); min-height: 1em; }
  .card-count { font-family: var(--display); font-size: 20px; }
  .card-more { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid var(--dust); justify-self: end; }
  .card-head[aria-expanded="true"] .card-more { transform: rotate(180deg); }
  .upgrades { display: grid; gap: 8px; padding: 0 12px 12px; }
  .buy-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px 12px; }
  .buy {
    min-height: 48px; border: 0; cursor: pointer; padding: 6px 4px;
    font-family: var(--display); font-size: 13px; letter-spacing: 0.5px;
    background: var(--amber); color: var(--edge);
    box-shadow: inset 0 -4px 0 #a8661c, 0 3px 0 var(--edge);
    transition: transform 60ms;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .buy:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 #a8661c, 0 1px 0 var(--edge); }
  .buy:disabled { background: var(--burrow-hi); color: var(--dust); box-shadow: 0 3px 0 var(--edge); cursor: default; }
  .details { padding: 0 12px 14px; display: grid; gap: 10px; border-top: 3px dashed var(--burrow-hi); padding-top: 12px; }
  .desc { margin: 0; color: var(--bone); max-width: 60ch; }
  .cost-line { margin: 0; color: var(--dust); font-size: 14px; }
  .upgrade { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--earth); padding: 10px; }
  .upgrade-top { display: flex; justify-content: space-between; gap: 8px; grid-column: 1; }
  .upgrade-name { font-family: var(--display); font-size: 13px; text-transform: capitalize; }
  .upgrade-level { color: var(--dust); font-size: 13px; }
  .upgrade-cost { grid-column: 1; font-size: 13px; color: var(--dust); }
  .bar { grid-column: 1; height: 8px; background: var(--burrow-hi); display: block; }
  .bar-fill { display: block; height: 100%; width: 0; background: var(--chitin); }
  .bar-fill.ready { background: var(--amber); }
  .buy-upgrade { grid-column: 2; grid-row: 1 / span 3; min-width: 96px; }

  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--dust); font-size: 13px; padding-block: 8px; }
  .meta p { margin: 0; max-width: 40ch; }
  .meta a { color: var(--bone); }
  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* bottom tab bar */
  #nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--edge);
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    gap: 4px;
  }
  .nav-btn {
    display: grid; justify-items: center; gap: 1px; background: none; border: 0; padding: 4px 2px; min-height: 64px; cursor: pointer; min-width: 0;
  }
  .nav-icon { width: 28px; height: 28px; }
  .nav-label { font-family: var(--display); font-size: 10px; text-transform: capitalize; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count { font-size: 11px; color: var(--dust); }
  .nav-btn[aria-current="page"] { background: var(--burrow-hi); box-shadow: inset 0 -3px 0 var(--amber); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn { position: relative; }
  .nav-btn.has-upgrade::after {
    content: ""; position: absolute; top: 6px; right: calc(50% - 22px);
    width: 8px; height: 8px; background: var(--amber); box-shadow: 0 0 0 2px var(--edge);
  }

  /* toast and floating numbers */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 7;
    bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    width: min(420px, calc(100% - 32px));
    background: var(--chitin); color: var(--bone); padding: 10px 14px;
    box-shadow: 0 -3px 0 var(--edge), 0 3px 0 var(--edge), -3px 0 0 var(--edge), 3px 0 0 var(--edge);
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  }
  #toast small { display: block; font-family: var(--display); font-size: 10px; letter-spacing: 2px; color: var(--amber); }
  #toast-title { font-family: var(--display); font-size: 14px; text-transform: capitalize; }
  #toast-points { font-family: var(--display); color: var(--amber); }
  #toast.show { animation: pop 300ms steps(4); }
  @keyframes pop { from { transform: translate(-50%, 24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .float {
    position: fixed; z-index: 8; pointer-events: none; transform: translate(-50%, -100%);
    font-family: var(--display); font-size: 16px; color: var(--amber);
    text-shadow: 2px 2px 0 var(--edge);
    animation: rise 900ms steps(9) forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -260%); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .float, #toast.show { animation-duration: 1ms; }
  }
  @media (max-width: 380px) {
    header { grid-template-columns: 1fr 1fr; }
    .brand { grid-column: 1 / -1; }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">SWARM<small>HIVE</small></div>
    <div class="res frame" aria-label="Meat">
      <img class="px-icon" id="res-meat-icon" alt="">
      <b id="res-meat" class="num">35</b><span id="res-meat-rate" class="num">+0/s</span>
    </div>
    <div class="res frame" aria-label="Larvae">
      <img class="px-icon" id="res-larva-icon" alt="">
      <b id="res-larva" class="num">10</b><span id="res-larva-rate" class="num">+0/s</span>
    </div>
  </header>

  <section class="scene frame" aria-label="Your hive">
    <canvas id="hive" role="img" aria-label="Animated view of your hive: drones carry meat to the pile while queens lay eggs"></canvas>
    <div class="scene-bar">
      <span>Your hive, live</span>
      <button class="chip" id="speed" type="button" aria-pressed="false">Speed ×1</button>
    </div>
  </section>

  <h2 id="tab-title">Meat</h2>
  <ul id="list"></ul>

  <div class="meta">
    <p>Pixel mock-up on the new TypeScript engine. Progress saves in this browser.</p>
    <p>Unofficial fork of <a href="https://www.swarmsim.com">Swarm Simulator</a> by Evan Rosson. Free software under the <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a>. <a href="https://github.com/druzn3k/swarm">Source code</a>.</p>
    <button class="chip" id="reset" type="button">Start over</button>
    <div class="confirm" id="reset-confirm" hidden>
      <span>Erase this hive?</span>
      <button class="chip" id="reset-yes" type="button">Erase</button>
      <button class="chip" id="reset-no" type="button">Keep</button>
    </div>
  </div>
</div>

<div id="toast" role="status" hidden>
  <div><small>ACHIEVEMENT</small><span id="toast-title"></span></div>
  <span id="toast-points"></span>
</div>
<nav id="nav" aria-label="Swarm tabs"></nav>

<!--APP-->
