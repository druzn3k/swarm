[package]
name = "swarm-num"
version = "0.1.0"
description = "Big-number type for the Swarm Simulator engine: f64 mantissa, i64 decimal exponent."
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
