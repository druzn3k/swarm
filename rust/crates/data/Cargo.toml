[package]
name = "swarm-data"
version = "0.1.0"
description = "Swarm Simulator game data: the schema of gamedata.json and the resolved, typed GameData."
edition.workspace = true
license.workspace = true
publish = false
# the data is generated by tables/src/json/gen-json.ts and committed: building
# this crate never needs Node
include = ["src/**", "data/gamedata.json", "Cargo.toml"]

[dependencies]
swarm-num = { path = "../num" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
